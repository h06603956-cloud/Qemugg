name: Ubuntu Runner with noVNC & Tailscale

on:
  workflow_dispatch:

jobs:
  run-ubuntu-runner:
    runs-on: ubuntu-latest

    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Start Tailscale & Connect
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-linux --accept-routes
          
          TS_IP=""
          for i in {1..15}; do
            TS_IP=$(tailscale ip -4 2>/dev/null || true)
            if [ -n "$TS_IP" ]; then
              break
            fi
            sleep 2
          done
          
          echo "Tailscale IP: $TS_IP"
          echo "TS_IP=$TS_IP" >> $GITHUB_ENV

      - name: Install Desktop Environment & VNC
        run: |
          # Устанавливаем легкий рабочий стол XFCE, VNC-сервер и Git
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies tigervnc-standalone-server git python3-pip

      - name: Setup noVNC and Start Web Access
        run: |
          # Устанавливаем websockify с обходом ограничений системного Python
          pip3 install websockify --break-system-packages
          
          # Скачиваем официальный noVNC клиент
          git clone https://github.com/novnc/noVNC.git /tmp/novnc
          
          # Создаем базовую конфигурацию для VNC
          mkdir -p ~/.vnc
          echo "password123" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          
          # Запускаем VNC сервер на дисплее :1 (порт 5901)
          vncserver :1 -geometry 1280x720 -depth 24
          
          # Запускаем чистый websockify вместо сломанного прокси-скрипта
          websockify --web=/tmp/novnc 8080 localhost:5901 &

      - name: Connection Details & Keep Alive
        run: |
          echo "=== UBUNTU RUNNER (noVNC) ACCESS ==="
          echo "Open this link in your browser (via Tailscale):"
          echo "http://${{ env.TS_IP }}:8080/vnc.html?host=${{ env.TS_IP }}&port=8080"
          echo ""
          echo "Password: password123"
          echo "==================================="
          sleep 21600
